# Verification-only override: enables SSO + SCIM and adds a mock OIDC provider.
# Not for production. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.ssotest.yml up -d --build
services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      # Bind the well-known issuer to the compose-network hostname so the API
      # container can discover it at http://mock-oidc:8080/default.
      JSON_CONFIG: >-
        {"interactiveLogin":false,"httpServer":"NettyWrapper","tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"grant_type","match":"authorization_code","claims":{"email":"grace@acme.com","email_verified":true,"name":"Grace Hopper","sub":"mock-grace-001"}}]}]}
    ports:
      - '8090:8080'
    restart: unless-stopped

  api:
    environment:
      SCIM_TOKEN: scim-secret-token
      OIDC_ISSUER: http://mock-oidc:8080/default
      OIDC_CLIENT_ID: nonlinear-app
      OIDC_CLIENT_SECRET: dev-secret
      OIDC_LABEL: Mock Entra ID
      OIDC_AUTO_PROVISION: 'true'
    depends_on:
      postgres:
        condition: service_healthy
