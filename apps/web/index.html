<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>nonlinear</title>
    <script>
      // Pre-paint: honor the stored theme/font preference so there's no flash.
      try {
        var pref = localStorage.getItem('nl-theme-pref') || localStorage.getItem('nl-theme');
        var resolved =
          pref === 'system' || !pref
            ? window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : pref;
        document.documentElement.dataset.theme = resolved;
        var f = localStorage.getItem('nl-font-size');
        if (f) document.documentElement.dataset.fontSize = f;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
